[package]
name = "umls-client"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
chrono = "0.4.45"
http = "1.5.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
umls-http = { version = "0.1.0", path = "../umls-http" }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
clap = { version = "4.6.6", features = ["derive", "env"] }
crossterm = "0.29.0"
env_logger = "0.11.11"
httpmock = "0.8.3"
ratatui = "0.30.0"
uuid = { version = "1.24.1", features = ["v4"] }

[features]
reqwest = ["umls-http/reqwest"]

[[example]]
name = "concept_info_using_cui"
required-features = ["reqwest"]

[[example]]
name = "concept_search_content"
required-features = ["reqwest"]

[[example]]
name = "concept_search_pages"
required-features = ["reqwest"]
