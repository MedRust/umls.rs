[package]
name = "umls-downloader"
version = "0.1.1"
edition = "2024"
description = "Async helpers for discovering and downloading UMLS, RxNorm, and SNOMED CT releases"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/umls-downloader"
repository = "https://github.com/MedRust/umls.rs.git"
keywords = ["umls", "rxnorm", "snomed", "terminology", "medical"]
categories = ["api-bindings", "science"]

[features]
reqwest = ["umls-http/reqwest"]

[dependencies]
async-trait = "0.1.91"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-core = "0.3.33"
futures-util = "0.3.33"
http = "1.4.2"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.19"
umls-http = { version = "0.1.0", path = "../umls-http" }
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "io-util",
  "sync",
  "time",
] }
httpmock = "0.8.3"
tempfile = "3"
serde_json = "1.0.151"
