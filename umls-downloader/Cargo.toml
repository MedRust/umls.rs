[package]
name = "umls-downloader"
version = "0.1.1"
edition = "2024"
description = "Async helpers for discovering and downloading UMLS, RxNorm, and SNOMED CT releases"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/umls-downloader"
repository = "https://github.com/MedRust/umls.rs.git"
keywords = ["umls", "rxnorm", "snomed", "terminology", "medical"]
categories = ["api-bindings", "science"]

[features]
reqwest = ["dep:reqwest", "dep:serde_json"]

[dependencies]
async-trait = "0.1.91"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-core = "0.3.33"
futures-util = "0.3.33"
http = "1.4.2"
reqwest = { version = "0.13.1", optional = true, features = ["json", "stream"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", optional = true }
thiserror = "2.0.19"
url = { version = "2.5.8", features = ["serde"] }
