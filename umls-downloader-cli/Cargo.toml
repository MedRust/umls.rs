[package]
name = "umls-downloader-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "umls-download"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.91"
bytes = "1.12.1"
chrono = "0.4.45"
clap = { version = "4.5.54", features = ["derive", "env"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3.33"
http = "1.4.2"
ratatui = "0.30.0"
reqwest = { version = "0.13.1", features = ["json", "stream"] }
serde = "1.0.229"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
umls-downloader = { path = "../umls-downloader" }
